aid: wayray
name: WayRay
description: WayRay AG was a Swiss deep-tech company, founded in 2012 by Vitaly Ponomarev and headquartered
  in Zurich, that developed holographic augmented-reality displays for the automotive industry — the Deep
  Reality Display, an embedded holographic optical element laminated into a vehicle windshield, paired
  with an AR rendering engine and the True AR SDK for building in-vehicle AR applications. The company
  raised roughly $140M from Porsche, Hyundai, Alibaba and others and shipped concept integrations with
  Pininfarina and Karma Automotive, but the Zurich probate court declared its bankruptcy effective 14
  August 2023 and its assets have been in liquidation since. The marketing site at wayray.com remains
  standing as a static archive; the developer surface it once advertised (the True AR SDK download at
  wayray.com/sdk, a C++ toolkit with an emulator, simulator, docs and samples) now returns 404, and no
  public web API, OpenAPI, developer portal or package registry presence survives.
